name: tests

on:
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest